version: '3.8'

services:
  # 2. MariaDB (Database với volume cho dữ liệu)
  db:
    image: mariadb:10.6
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=nextcloud_admin
      - MYSQL_PASSWORD=nextcloud_pwd
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  # 3. Redis (Cache để tăng tốc hệ thống)
  redis:
    image: redis:alpine
    restart: always

  # 1. Nextcloud (Ứng dụng chính chạy port 80)
  app:
    image: nextcloud:latest
    restart: always
    ports:
      - 80:80
    links:
      - db
      - redis
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=nextcloud_pwd
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - REDIS_HOST=redis

volumes:
  db_data:
  nextcloud_data: